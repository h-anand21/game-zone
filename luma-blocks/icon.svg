<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182744"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BE7FA"/>
      <stop offset="100%" stop-color="#28B5D4"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B39AFC"/>
      <stop offset="100%" stop-color="#7B56EB"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD182"/>
      <stop offset="100%" stop-color="#F59E1B"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF96B4"/>
      <stop offset="100%" stop-color="#E84877"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77EDC0"/>
      <stop offset="100%" stop-color="#26C98B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#344764" stroke-width="8"/>

  <!-- Glowing Luma Blocks (L-shape and square cluster) -->
  <g filter="url(#glow)">
    <!-- Cyan 2x2 group -->
    <rect x="120" y="120" width="80" height="80" rx="18" fill="url(#cyanGrad)"/>
    <rect x="210" y="120" width="80" height="80" rx="18" fill="url(#cyanGrad)"/>
    <rect x="120" y="210" width="80" height="80" rx="18" fill="url(#cyanGrad)"/>
    <rect x="210" y="210" width="80" height="80" rx="18" fill="url(#cyanGrad)"/>

    <!-- Violet bar -->
    <rect x="300" y="120" width="80" height="80" rx="18" fill="url(#violetGrad)"/>
    <rect x="300" y="210" width="80" height="80" rx="18" fill="url(#violetGrad)"/>
    <rect x="300" y="300" width="80" height="80" rx="18" fill="url(#violetGrad)"/>

    <!-- Amber corner -->
    <rect x="120" y="300" width="80" height="80" rx="18" fill="url(#amberGrad)"/>
    <rect x="210" y="300" width="80" height="80" rx="18" fill="url(#amberGrad)"/>

    <!-- Mint single highlight -->
    <rect x="210" y="300" width="80" height="80" rx="18" fill="url(#mintGrad)"/>
    <rect x="300" y="300" width="80" height="80" rx="18" fill="url(#pinkGrad)"/>
  </g>
</svg>
