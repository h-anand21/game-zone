name: GameHub CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Mobile App Tests ──────────────────────────────────────
  mobile-tests:
    name: Mobile App Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gamehub-mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ── Backend Tests ──────────────────────────────────────────
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gamehub-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ── FPS Server Tests ────────────────────────────────────────
  fps-server-tests:
    name: FPS Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub-fps-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gamehub-fps-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ── Docker Build Check ──────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, fps-server-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t gamehub-backend ./gamehub-backend
      - name: Build FPS Server Image
        run: docker build -t gamehub-fps ./gamehub-fps-server

  # ── Expo EAS Build (Mobile) ─────────────────────────────────
  mobile-build:
    name: Expo EAS Build
    runs-on: ubuntu-latest
    needs: [mobile-tests]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: gamehub-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build Android Preview
        run: eas build --platform android --profile preview --non-interactive
