name: GameHub CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Mobile App Tests ──────────────────────────────────────
  mobile-tests:
    name: Mobile App Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  # ── Backend Tests ──────────────────────────────────────────
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm test

  # ── FPS Server Tests ────────────────────────────────────────
  fps-server-tests:
    name: FPS Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub-fps-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  # ── Docker Build Check ──────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, fps-server-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t gamehub-backend ./gamehub-backend
      - name: Build FPS Server Image
        run: docker build -t gamehub-fps ./gamehub-fps-server
