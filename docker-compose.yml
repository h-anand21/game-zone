# ============================================================
# GameHub — Docker Compose (Full Stack)
# ============================================================

version: '3.8'

services:
  backend:
    build:
      context: ./gamehub-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gamehub-network

  fps-server:
    build:
      context: ./gamehub-fps-server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - EXPRESS_BACKEND_URL=http://backend:5000
      - TICK_RATE=60
      - MAX_PLAYERS_PER_ROOM=8
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gamehub-network

networks:
  gamehub-network:
    driver: bridge
